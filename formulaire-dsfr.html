<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abonnement Lettre d'information - Devenir Enseignant</title>
  <!-- Feuilles de style officielles DSFR -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/utility/utility.min.css">
</head>
<body>
  <main class="fr-container fr-my-4w">
    <div class="fr-grid-row fr-grid-row--center">
      <div class="fr-col-12 fr-col-md-8 fr-col-lg-6">
        
        <!-- En-tête -->
        <h1 class="fr-h2">Abonnez-vous à notre lettre d'information</h1>
        <p class="fr-text--lead">
          Abonnez-vous à notre lettre d'information pour recevoir des infos personnalisées, des conseils pratiques et le calendrier des temps forts.
        </p>
        
        <!-- Mention globale RGAA (obligation sans astérisque visible) -->
        <p class="fr-text--xs fr-mb-3w">
          Sauf mention contraire, tous les champs sont obligatoires.
        </p>

        <!-- Formulaire Brevo -->
        <form id="form-newsletter-men" method="POST" action="[URL_ACTION_BREVO]">
          
          <!-- Nom -->
          <div class="fr-input-group">
            <label class="fr-label" for="nom">
              Nom
              <span class="fr-sr-only">(champ obligatoire)</span>
            </label>
            <input 
              class="fr-input" 
              type="text" 
              id="nom" 
              name="NOM" 
              placeholder="Ex : Dupont" 
              autocomplete="family-name" 
              required 
              aria-required="true"
            />
          </div>

          <!-- Prénom -->
          <div class="fr-input-group">
            <label class="fr-label" for="prenom">
              Prénom
              <span class="fr-sr-only">(champ obligatoire)</span>
            </label>
            <input 
              class="fr-input" 
              type="text" 
              id="prenom" 
              name="PRENOM" 
              placeholder="Ex : Jean" 
              autocomplete="given-name" 
              required 
              aria-required="true"
            />
          </div>

          <!-- Adresse électronique -->
          <div class="fr-input-group">
            <label class="fr-label" for="email">
              Adresse électronique
              <span class="fr-sr-only">(champ obligatoire)</span>
            </label>
            <input 
              class="fr-input" 
              type="email" 
              id="email" 
              name="EMAIL" 
              placeholder="Ex : jean.dupont@gmail.com" 
              autocomplete="email" 
              required 
              aria-required="true"
            />
          </div>

          <!-- Code Postal -->
          <div class="fr-input-group">
            <label class="fr-label" for="code-postal">
              Code Postal
              <span class="fr-sr-only">(champ obligatoire)</span>
            </label>
            <input 
              class="fr-input" 
              type="text" 
              id="code-postal" 
              name="CODE_POSTAL" 
              placeholder="Ex : 75001" 
              pattern="[0-9]{5}" 
              maxlength="5" 
              inputmode="numeric" 
              autocomplete="postal-code" 
              required 
              aria-required="true"
            />
          </div>

          <!-- Menu déroulant 'Je suis en' -->
          <div class="fr-select-group">
            <label class="fr-label" for="statut">
              Je suis en
              <span class="fr-sr-only">(champ obligatoire)</span>
            </label>
            <select class="fr-select" id="statut" name="STATUT" required aria-required="true">
              <option value="" disabled selected hidden>Sélectionner une option</option>
              <option value="reconversion">Reconversion professionnelle</option>
              <option value="etudiant">Études supérieures</option>
              <option value="autre">Autre</option>
            </select>
          </div>

          <!-- Boutons d'action -->
          <div class="fr-btns-group fr-btns-group--inline-md fr-mt-4w">
            <button 
              type="submit" 
              id="btn-subscribe" 
              class="fr-btn fr-btn--icon-right fr-icon-arrow-right-line">
              Je m'abonne
            </button>
            
            <a 
              href="[LIEN_DESABONNEMENT_BREVO]" 
              class="fr-btn fr-btn--secondary fr-btn--icon-right fr-icon-arrow-right-line" 
              role="button">
              Je me désabonne
            </a>
          </div>

        </form>
      </div>
    </div>
  </main>

  <!-- Script officiel DSFR -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.module.min.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/dsfr.nomodule.min.js"></script>
</body>
</html>

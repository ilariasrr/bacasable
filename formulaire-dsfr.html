<!doctype html>
<html lang="fr" data-fr-scheme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription à la lettre Devenir enseignant</title>

  <!-- Styles nécessaires au fonctionnement du formulaire Brevo -->
  <link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">

  <!-- DSFR, version figée pour garantir un rendu stable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/utility/utility.min.css">

  <style>
    /* Pont minimal entre le moteur Brevo et la présentation DSFR. */
    body {
      margin: 0;
      background: var(--background-alt-grey);
    }

    .sib-form {
      padding: 0;
      background: transparent;
      text-align: initial;
    }

    .sib-form-container,
    #sib-container {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: initial;
    }

    .sib-form-message-panel {
      display: none;
      max-width: none;
      margin: 0 0 2rem;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .sib-form-message-panel[style*="display: block"],
    .sib-form-message-panel[style*="display:block"] {
      display: block !important;
    }

    .sib-form-message-panel__text,
    .sib-form-message-panel__text--center {
      display: block;
      padding: 0;
      text-align: left;
    }

    .sib-notification__icon {
      display: none;
    }

    .entry__field {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .entry__error:empty {
      display: none;
    }

    .entry__error:not(:empty) {
      display: block;
      margin-top: .5rem;
      color: var(--text-default-error);
      font-size: .875rem;
      line-height: 1.5rem;
    }

    .fr-input-group:has(.entry__error:not(:empty)),
    .fr-select-group:has(.entry__error:not(:empty)) {
      padding-left: 1rem;
      box-shadow: inset 2px 0 0 0 var(--border-plain-error);
    }

    .fr-input-group:has(.entry__error:not(:empty)) .fr-input,
    .fr-select-group:has(.entry__error:not(:empty)) .fr-select {
      box-shadow: inset 0 -2px 0 0 var(--border-plain-error);
    }

    .sib-form-block__button-with-loader .progress-indicator__icon {
      width: 1rem;
      height: 1rem;
      margin-right: .5rem;
      fill: currentColor;
    }

    .fr-card--no-border {
      border: 0;
      box-shadow: none;
    }

    /* Libellé : texte + astérisque (générée par Brevo via data-required)
       sur la première ligne, texte d'aide DSFR en dessous. */
    .entry__label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      margin-bottom: 0;
    }

    .entry__label::after {
      order: 1;
      margin-left: .25rem;
      color: var(--text-default-error);
    }

    .entry__label > .fr-hint-text {
      order: 2;
      float: none;
      flex-basis: 100%;
      margin-top: .25rem;
    }
  </style>
</head>

<body>
  <main id="contenu" class="fr-container fr-py-6w">
    <div class="fr-grid-row fr-grid-row--center">
      <div class="fr-col-12 fr-col-md-8 fr-col-lg-6">
        <div class="fr-card fr-card--no-border fr-p-4w fr-p-md-6w">
          <div class="fr-card__body">
            <div class="fr-card__content">

              <div class="sib-form">
                <div id="sib-form-container" class="sib-form-container">

                  <!-- Structure Brevo conservée ; alerte visuelle DSFR à l'intérieur. -->
                  <div id="error-message" class="sib-form-message-panel" role="alert" aria-live="assertive">
                    <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
                      <div class="fr-alert fr-alert--error fr-alert--sm">
                        <p class="sib-form-message-panel__inner-text">Nous n'avons pas pu confirmer votre inscription.</p>
                      </div>
                    </div>
                  </div>

                  <div id="success-message" class="sib-form-message-panel" role="status" aria-live="polite">
                    <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
                      <div class="fr-alert fr-alert--success fr-alert--sm">
                        <p class="sib-form-message-panel__inner-text">Votre inscription est confirmée, merci ! Vous recevrez votre première lettre Devenir enseignant très bientôt</p>
                      </div>
                    </div>
                  </div>

                  <div id="sib-container" class="sib-container--large sib-container--vertical">
                    <form
                      id="sib-form"
                      method="post"
                      action="https://c341516d.sibforms.com/serve/MUIFAOhouc96rHheFnrkqcMzDkOH9pKzS09l7eCdkbMR8uPfo_xrOblZ0KTnuZ2Ba5MdJaO092qgcZQ-RQsn47XfzRe-Fhv9XoKGeaxJTN4hECMc9BC_akxlK7IYKopZwah75FKHJ3x8LHhDp0lu0gG3RsIxG9sHZIlX_DJ1n4pOFipAnzZnlJ2RZtA5UgkXNYxo7iRKDacwkxD07Q=="
                      data-type="subscription"
                    >
                      <fieldset class="fr-fieldset" aria-labelledby="inscription-legend inscription-messages">
                        <legend class="fr-sr-only" id="inscription-legend">Inscription à la lettre Devenir enseignant</legend>

                        <div class="fr-fieldset__element">
                          <div class="sib-input sib-form-block fr-input-group">
                            <div class="form__entry entry_block">
                              <div class="form__label-row">
                                <label class="entry__label fr-label" for="NOM" data-required="*">Nom</label>
                                <div class="entry__field">
                                  <input class="input fr-input" maxlength="200" type="text" id="NOM" name="NOM" autocomplete="family-name" data-required="true" required>
                                </div>
                              </div>
                              <p class="entry__error entry__error--primary" id="NOM-error"></p>
                            </div>
                          </div>
                        </div>

                        <div class="fr-fieldset__element">
                          <div class="sib-input sib-form-block fr-input-group">
                            <div class="form__entry entry_block">
                              <div class="form__label-row">
                                <label class="entry__label fr-label" for="PRENOM" data-required="*">Prénom</label>
                                <div class="entry__field">
                                  <input class="input fr-input" maxlength="200" type="text" id="PRENOM" name="PRENOM" autocomplete="given-name" data-required="true" required>
                                </div>
                              </div>
                              <p class="entry__error entry__error--primary" id="PRENOM-error"></p>
                            </div>
                          </div>
                        </div>

                        <div class="fr-fieldset__element">
                          <div class="sib-input sib-form-block fr-input-group">
                            <div class="form__entry entry_block">
                              <div class="form__label-row">
                                <label class="entry__label fr-label" for="EMAIL" data-required="*">
                                  Adresse électronique
                                  <span class="fr-hint-text">Veuillez renseigner votre adresse email pour vous inscrire. Ex. : abc@xyz.com</span>
                                </label>
                                <div class="entry__field">
                                  <input class="input fr-input" type="email" id="EMAIL" name="EMAIL" autocomplete="email" inputmode="email" data-required="true" required>
                                </div>
                              </div>
                              <p class="entry__error entry__error--primary" id="EMAIL-error"></p>
                            </div>
                          </div>
                        </div>

                        <div class="fr-fieldset__element">
                          <div class="sib-input sib-form-block fr-input-group">
                            <div class="form__entry entry_block">
                              <div class="form__label-row">
                                <label class="entry__label fr-label" for="CODE_POSTAL" data-required="*">Code Postal</label>
                                <div class="entry__field">
                                  <input class="input fr-input" maxlength="200" type="text" id="CODE_POSTAL" name="CODE_POSTAL" autocomplete="postal-code" inputmode="numeric" data-numeric="true" data-required="true" required>
                                </div>
                              </div>
                              <p class="entry__error entry__error--primary" id="CODE_POSTAL-error"></p>
                            </div>
                          </div>
                        </div>

                        <div class="fr-fieldset__element">
                          <div class="sib-select sib-form-block fr-select-group" data-required="true">
                            <div class="form__entry entry_block">
                              <div class="form__label-row">
                                <label class="entry__label fr-label" for="NIVEAU_ETUDE" data-required="*">Je suis en</label>
                                <div class="entry__field">
                                  <select class="input fr-select" id="NIVEAU_ETUDE" name="NIVEAU_ETUDE" data-required="true" required>
                                    <option value="" disabled selected>Choisissez une valeur</option>
                                    <option class="sib-menu__item" value="1">Seconde</option>
                                    <option class="sib-menu__item" value="2">Première</option>
                                    <option class="sib-menu__item" value="3">Terminale</option>
                                    <option class="sib-menu__item" value="4">Licence 1</option>
                                    <option class="sib-menu__item" value="5">Licence 2 (ou équivalent)</option>
                                    <option class="sib-menu__item" value="6">Licence 3</option>
                                    <option class="sib-menu__item" value="7">Master 1</option>
                                    <option class="sib-menu__item" value="8">Master 2</option>
                                    <option class="sib-menu__item" value="9">Reconversion professionnelle</option>
                                    <option class="sib-menu__item" value="10">Autre</option>
                                  </select>
                                </div>
                              </div>
                              <p class="entry__error entry__error--primary" id="NIVEAU_ETUDE-error"></p>
                            </div>
                          </div>
                        </div>

                        <div class="fr-fieldset__element">
                          <div id="inscription-messages" class="fr-messages-group" aria-live="polite"></div>
                        </div>
                      </fieldset>

                      <div class="sib-form-block fr-mt-2w">
                        <button class="sib-form-block__button sib-form-block__button-with-loader fr-btn" form="sib-form" type="submit">
                          <svg class="progress-indicator__icon sib-hide-loader-icon" aria-hidden="true" viewBox="0 0 512 512">
                            <path d="M460.116 373.846l-20.823-12.022c-5.541-3.199-7.54-10.159-4.663-15.874 30.137-59.886 28.343-131.652-5.386-189.946-33.641-58.394-94.896-95.833-161.827-99.676C261.028 55.961 256 50.751 256 44.352V20.309c0-6.904 5.808-12.337 12.703-11.982 83.556 4.306 160.163 50.864 202.11 123.677 42.063 72.696 44.079 162.316 6.031 236.832-3.14 6.148-10.75 8.461-16.728 5.01z"></path>
                          </svg>
                          S'inscrire
                        </button>
                      </div>

                      <input type="text" name="email_address_check" value="" class="input--hidden">

                      <input type="hidden" name="locale" value="fr">
                    </form>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    window.REQUIRED_CODE_ERROR_MESSAGE = 'Veuillez choisir un code pays';
    window.LOCALE = 'fr';
    window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE = "Les informations que vous avez fournies ne sont pas valides. Veuillez vérifier le format du champ et réessayer.";
    window.REQUIRED_ERROR_MESSAGE = "Vous devez renseigner ce champ. ";
    window.GENERIC_INVALID_MESSAGE = "Les informations que vous avez fournies ne sont pas valides. Veuillez vérifier le format du champ et réessayer.";
    window.INVALID_NUMBER = "Les informations que vous avez fournies ne sont pas valides. Veuillez vérifier le format du champ et réessayer.";
    window.INVALID_DATE = "Veuillez saisir une date valide";
    window.REQUIRED_MULTISELECT_MESSAGE = 'Veuillez choisir au moins une option';
    window.translation = {
      common: {
        selectedList: '{quantity} liste sélectionnée',
        selectedLists: '{quantity} listes sélectionnées',
        selectedOption: '{quantity} sélectionné',
        selectedOptions: '{quantity} sélectionnés'
      }
    };
    var AUTOHIDE = Boolean(0);
  </script>

  <!-- Scripts Brevo et DSFR -->
  <script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr/dsfr.module.min.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.3/dist/dsfr/dsfr.nomodule.min.js"></script>
</body>
</html>
